<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETRAX | LIVE SENSOR</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#050b09;color:#00ff9d;
 font-family:Arial,sans-serif;text-align:center;
 padding:25px 15px;
}
h1{letter-spacing:5px;font-size:28px}
.sub{color:#789b8b;letter-spacing:3px}
.panel{
 max-width:430px;margin:30px auto;
 padding:25px;border:1px solid #00ff9d;
 border-radius:15px;
 background:#07130f;
 box-shadow:0 0 20px #00ff9d22;
}
.label{color:#8aa99b;font-size:13px;letter-spacing:2px}
.distance{font-size:65px;font-weight:bold;margin:20px 0}
.status{
 padding:15px;border:1px solid #00ff9d;
 border-radius:8px;font-size:18px;
 margin-top:20px;
}
.red{color:#ff4545;border-color:#ff4545}
.green{color:#00ff9d}
button{
 background:#00ff9d;color:#00150c;
 border:0;padding:13px 25px;
 border-radius:6px;font-weight:bold;
 margin-top:20px;
}
.small{color:#668477;font-size:12px;margin-top:25px}
</style>
</head>

<body>

<h1>NETRAX</h1>
<div class="sub">ULTRASONIC DETECTION SYSTEM</div>

<div class="panel">
 <div class="label">LIVE DISTANCE</div>
 <div class="distance" id="distance">-- cm</div>

 <div class="label">DETECTION RANGE: 15 CM</div>

 <div class="status" id="status">WAITING FOR SENSOR</div>

 <p class="small">SENSOR: HC-SR04</p>
 <p class="small">SYSTEM: ARDUINO UNO</p>
 <p class="small">MODE: FIXED SENSOR</p>
</div>

<button onclick="connectSensor()">CONNECT SENSOR</button>

<div class="small" id="connection">
 USB CONNECTION: DISCONNECTED
</div>

<script>
let port;
let reader;

async function connectSensor(){
 try{
  if(!("serial" in navigator)){
   alert("Web Serial is not supported in this browser. Use desktop Chrome or Edge.");
   return;
  }

  port = await navigator.serial.requestPort();
  await port.open({baudRate:9600});

  document.getElementById("connection").innerText =
  "USB CONNECTION: CONNECTED";

  const decoder = new TextDecoderStream();
  port.readable.pipeTo(decoder.writable);
  reader = decoder.readable.getReader();

  let buffer="";

  while(true){
   const {value,done}=await reader.read();
   if(done)break;

   buffer+=value;

   let lines=buffer.split(/\r?\n/);
   buffer=lines.pop();

   for(let line of lines){
    let match=line.match(/Distance:\s*([\d.]+)\s*cm/i);

    if(match){
     showDistance(parseFloat(match[1]));
    }
   }
  }

 }catch(error){
  document.getElementById("connection").innerText =
  "USB CONNECTION: ERROR";
  console.log(error);
 }
}

function showDistance(d){
 const distance=document.getElementById("distance");
 const status=document.getElementById("status");

 if(!Number.isFinite(d) || d<=0){
  distance.innerText="-- cm";
  status.innerText="NO OBJECT";
  status.className="status green";
  return;
 }

 distance.innerText=d.toFixed(1)+" cm";

 if(d<=15){
  status.innerText="OBJECT DETECTED";
  status.className="status red";
 }else{
  status.innerText="CLEAR";
  status.className="status green";
 }
}
</script>

</body>
</html>
