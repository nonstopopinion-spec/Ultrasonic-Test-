<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AUTO TURRET | RADAR</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #030807;
    color: #00ff88;
    font-family: Arial, sans-serif;
    text-align: center;
}

header {
    padding: 22px 10px;
    border-bottom: 1px solid #00ff8844;
}

h1 {
    letter-spacing: 5px;
    text-shadow: 0 0 15px #00ff88;
    margin: 5px;
}

.subtitle {
    color: #6b9b85;
    font-size: 12px;
    letter-spacing: 3px;
}

.status {
    margin: 20px auto;
    color: #00ff88;
    font-size: 13px;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: #00ff88;
    border-radius: 50%;
    box-shadow: 0 0 12px #00ff88;
    margin-right: 8px;
}

.radar {
    width: min(85vw, 340px);
    aspect-ratio: 1;
    margin: 25px auto;
    border-radius: 50%;
    border: 2px solid #00ff88;
    position: relative;
    overflow: hidden;

    background:
    linear-gradient(90deg, transparent 49.7%, #00ff8866 50%, transparent 50.3%),
    linear-gradient(transparent 49.7%, #00ff8866 50%, transparent 50.3%),
    repeating-radial-gradient(
        circle,
        transparent 0 23%,
        #00ff8855 24% 24.5%,
        transparent 25%
    );

    box-shadow:
    0 0 20px #00ff8844,
    inset 0 0 25px #00ff8822;
}

.scan {
    position: absolute;
    width: 50%;
    height: 50%;
    top: 50%;
    left: 50%;
    transform-origin: top left;
    background: linear-gradient(
        45deg,
        #00ff8855,
        transparent 75%
    );
    animation: rotate 3s linear infinite;
}

@keyframes rotate {
    to {
        transform: rotate(360deg);
    }
}

.target {
    position: absolute;
    width: 10px;
    height: 10px;
    background: red;
    border-radius: 50%;
    top: 30%;
    left: 68%;
    box-shadow: 0 0 15px red;
    animation: blink 1s infinite alternate;
}

@keyframes blink {
    to { opacity: 0.2; }
}

.info {
    width: 85%;
    max-width: 340px;
    margin: 12px auto;
    padding: 14px;
    background: #07140f;
    border: 1px solid #00ff8833;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
}

.value {
    color: white;
}

button {
    margin: 20px;
    padding: 13px 25px;
    border: 1px solid #00ff88;
    background: #00ff88;
    color: black;
    font-weight: bold;
    border-radius: 6px;
}

footer {
    padding: 20px;
    color: #527765;
    font-size: 11px;
}
</style>
</head>

<body>

<header>
    <h1>AUTO TURRET</h1>
    <div class="subtitle">ULTRASONIC RADAR SYSTEM</div>
</header>

<div class="status">
    <span class="dot"></span>
    SYSTEM ONLINE
</div>

<div class="radar">
    <div class="scan"></div>
    <div class="target"></div>
</div>

<div class="info">
    <span>MODE</span>
    <span class="value">DEMO</span>
</div>

<div class="info">
    <span>DISTANCE</span>
    <span class="value" id="distance">-- cm</span>
</div>

<div class="info">
    <span>DETECTION</span>
    <span class="value" id="detection">WAITING</span>
</div>

<button onclick="testRadar()">TEST RADAR</button>

<footer>
    PROJECT NETRAX / AUTO TURRET<br>
    ULTRASONIC DETECTION INTERFACE
</footer>

<script>
function testRadar() {

    let d = Math.floor(Math.random() * 100) + 1;

    document.getElementById("distance").innerText = d + " cm";

    document.getElementById("detection").innerText =
        d < 50 ? "OBJECT DETECTED" : "CLEAR";
}
</script>

</body>
</html>
