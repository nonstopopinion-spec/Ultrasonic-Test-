<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NETRAX | Live Radar</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030807;
  color: #00ff88;
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 18px;
}

header {
  padding: 15px;
  border-bottom: 1px solid #00ff8855;
}

h1 {
  font-size: 32px;
  letter-spacing: 5px;
  text-shadow: 0 0 15px #00ff88;
}

.subtitle {
  color: #80a99a;
  font-size: 11px;
  margin-top: 8px;
  letter-spacing: 3px;
}

.status {
  margin: 18px auto;
  padding: 12px;
  max-width: 400px;
  border: 1px solid #00ff8870;
  border-radius: 8px;
  background: #07150f;
  font-weight: bold;
}

#statusText {
  color: #00ff88;
}

.radar-container {
  width: 100%;
  max-width: 420px;
  margin: 25px auto;
  position: relative;
}

canvas {
  width: 100%;
  display: block;
}

.info {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  max-width: 420px;
  margin: auto;
}

.box {
  background: #07130f;
  border: 1px solid #00ff8844;
  padding: 18px 8px;
  border-radius: 10px;
}

.label {
  color: #719888;
  font-size: 11px;
  letter-spacing: 2px;
}

.value {
  font-size: 25px;
  margin-top: 10px;
  color: #00ff88;
}

.alert .value {
  color: #ff3030;
}

.alert {
  border-color: #ff3030;
}

footer {
  margin-top: 35px;
  padding: 18px;
  border-top: 1px solid #00ff8833;
  color: #809b8e;
  font-size: 12px;
  letter-spacing: 3px;
}

footer span {
  color: #00ff88;
  font-weight: bold;
}

</style>
</head>

<body>

<header>
  <h1>NETRAX</h1>
  <div class="subtitle">180° ULTRASONIC RADAR SYSTEM</div>
</header>

<div class="status">
  SYSTEM STATUS :
  <span id="statusText">CONNECTING...</span>
</div>

<div class="radar-container">
  <canvas id="radar" width="800" height="440"></canvas>
</div>

<div class="info">

  <div class="box" id="distanceBox">
    <div class="label">DISTANCE</div>
    <div class="value" id="distance">-- cm</div>
  </div>

  <div class="box">
    <div class="label">SERVO ANGLE</div>
    <div class="value" id="angle">--°</div>
  </div>

  <div class="box">
    <div class="label">DETECTION RANGE</div>
    <div class="value">25 cm</div>
  </div>

  <div class="box">
    <div class="label">SCANNER</div>
    <div class="value" id="scanner">ACTIVE</div>
  </div>

</div>

<footer>
  BUILD BY <span>ARYAN</span>
  <br><br>
  NETRAX SYSTEM © 2026
</footer>

<script>

const canvas = document.getElementById("radar");
const ctx = canvas.getContext("2d");

const cx = 400;
const cy = 410;
const radius = 370;

let angle = 0;
let distance = 0;
let detected = false;
let connected = false;

const detectionLimit = 25;

function drawRadar() {

  ctx.clearRect(0, 0, 800, 440);

  // Radar rings
  for(let r = 90; r <= radius; r += 90) {

    ctx.beginPath();
    ctx.arc(cx, cy, r, Math.PI, 2*Math.PI);
    ctx.strokeStyle = "#00ff8840";
    ctx.lineWidth = 2;
    ctx.stroke();

  }

  // Radar angle lines
  for(let a = 0; a <= 180; a += 30) {

    let rad = Math.PI - (a * Math.PI / 180);

    let x = cx + radius * Math.cos(rad);
    let y = cy - radius * Math.sin(rad);

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(x, y);
    ctx.strokeStyle = "#00ff8830";
    ctx.stroke();

    ctx.fillStyle = "#00ff88";
    ctx.font = "18px Arial";
    ctx.fillText(a + "°", x - 12, y - 10);

  }

  // Scan line
  let rad = Math.PI - angle * Math.PI / 180;

  let sx = cx + radius * Math.cos(rad);
  let sy = cy - radius * Math.sin(rad);

  // Scan glow
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(sx, sy);

  ctx.strokeStyle = detected ? "#ff2020" : "#00ff88";
  ctx.lineWidth = 4;
  ctx.shadowBlur = 20;
  ctx.shadowColor = detected ? "red" : "#00ff88";
  ctx.stroke();
  ctx.shadowBlur = 0;

  // Detection zone
  if(detected && distance > 0) {

    let objectRadius = Math.min(
      radius,
      (distance / 100) * radius
    );

    ctx.beginPath();
    ctx.arc(
      cx,
      cy,
      objectRadius,
      Math.PI,
      2 * Math.PI
    );

    ctx.fillStyle = "rgba(255,0,0,0.30)";
    ctx.fill();

  }

  // Center point
  ctx.beginPath();
  ctx.arc(cx, cy, 8, 0, 2*Math.PI);
  ctx.fillStyle = "#00ff88";
  ctx.fill();

}

function updateDashboard() {

  const status = document.getElementById("statusText");
  const distanceText = document.getElementById("distance");
  const angleText = document.getElementById("angle");
  const distanceBox = document.getElementById("distanceBox");

  angleText.innerText = angle + "°";

  if(!connected) {
    status.innerText = "DISCONNECTED";
    status.style.color = "orange";
    return;
  }

  if(detected) {

    status.innerText = "OBJECT DETECTED";
    status.style.color = "red";

    distanceBox.classList.add("alert");

  } else {

    status.innerText = "SYSTEM CLEAR";
    status.style.color = "#00ff88";

    distanceBox.classList.remove("alert");

  }

  distanceText.innerText =
    distance > 0 ? distance.toFixed(1) + " cm" : "NO OBJECT";

}

async function getData() {

  try {

    const response = await fetch(
      "http://127.0.0.1:8765/distance",
      {cache: "no-store"}
    );

    const data = await response.json();

    connected = true;

    if(data.angle !== undefined) {
      angle = Number(data.angle);
    }

    distance = Number(data.distance) || 0;

    detected = distance > 0 &&
               distance <= detectionLimit;

  } catch(error) {

    connected = false;
    detected = false;

  }

  updateDashboard();
  drawRadar();

}

setInterval(getData, 150);

drawRadar();

</script>

</body>
</html>
