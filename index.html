<script>
let updateTimer = null;

async function connectSensor() {
    const connection = document.getElementById("connection");
    const button = document.querySelector("button");

    connection.innerText = "CONNECTING TO NETRAX...";
    button.disabled = true;

    try {
        const response = await fetch(
            "http://127.0.0.1:8765/distance",
            { cache: "no-store" }
        );

        if (!response.ok) throw new Error("API Error");

        const data = await response.json();

        showDistance(data.distance);

        connection.innerText = "PYTHON BRIDGE: CONNECTED";

        if (updateTimer) clearInterval(updateTimer);

        updateTimer = setInterval(async () => {
            try {
                const res = await fetch(
                    "http://127.0.0.1:8765/distance",
                    { cache: "no-store" }
                );

                if (!res.ok) throw new Error();

                const sensor = await res.json();

                showDistance(sensor.distance);

                connection.innerText = "PYTHON BRIDGE: CONNECTED";

            } catch (error) {
                connection.innerText = "PYTHON BRIDGE: DISCONNECTED";
            }
        }, 500);

    } catch (error) {
        connection.innerText = "CONNECTION ERROR";
        alert("NETRAX Python Bridge connect nahi hua. Termux check karo.");
    }

    button.disabled = false;
}

function showDistance(d) {
    const distance = document.getElementById("distance");
    const status = document.getElementById("status");

    if (!Number.isFinite(d) || d <= 0) {
        distance.innerText = "-- cm";
        status.innerText = "NO OBJECT";
        status.className = "status green";
        return;
    }

    distance.innerText = d.toFixed(1) + " cm";

    if (d <= 15) {
        status.innerText = "OBJECT DETECTED";
        status.className = "status red";
    } else {
        status.innerText = "CLEAR";
        status.className = "status green";
    }
}
  </script>
